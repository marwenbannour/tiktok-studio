name: tiktok_studio
description: "ستوديو التيكتوك: سكريبتات فيديوهات TikTok بالدارجة التونسية بمساعدة Claude."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  camera: ^0.12.1
  gal: ^2.3.3
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  wakelock_plus: ^1.5.2
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  # خطوط Poppins مدمجة (bundled) → google_fonts يستعملهم بلا إنترنت
  # (cold start أسرع + يخدم offline — NFR «connexion instable»، وما يطيحش التست)
  assets:
    - google_fonts/
